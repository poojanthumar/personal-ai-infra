model_list:
  - model_name: tier0-local
    litellm_params:
      model: ollama/tinyllama
      api_base: http://127.0.0.1:11434
      timeout: 30
      num_retries: 0

litellm_settings:
  drop_params: true
  request_timeout: 30

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
